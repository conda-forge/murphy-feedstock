{% set name = "murphy" %}
{% set version = "0.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.zip
  sha256: 9c90d6b178dcda8bafb29274519d7eeb25246f0c0a5ce1c9795491929b34866a

build:
  noarch: python
  number: 2
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
    - matplotlib
    - nose

  run:
    - python >={{ python_min }}
    - matplotlib

test:
  requires:
    - python {{ python_min }}
  imports:
    - murphy
    - murphy.Tree
    - murphy.tests

about:
  home: https://github.com/drsuuzzz/murphy
  license: Apache-2.0
  summary: 'Generic tools to identify overlapping genomic regions'
  license_family: APACHE

extra:
  recipe-maintainers:
    - drsuuzzz
